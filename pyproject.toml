[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowbias-lab"
version = "0.1.0"
description = "Spurious correlation detection and mitigation in synthetic image classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Stage 2 uses native PyTorch tensors; torchvision/pretrained assets are unnecessary.
ml = ["torch>=2.6"]
eval = ["torch>=2.6", "matplotlib>=3.9"]
app = ["streamlit>=1.35"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
cowbias-prepare-data = "cowbias.data.pipeline:main"
cowbias-train = "cowbias.training.experiment:main"
cowbias-evaluate = "cowbias.evaluation.evaluator:main"
cowbias-verify-evaluation = "cowbias.evaluation.verification:main"
cowbias-verify-checkpoints = "cowbias.training.checkpoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
