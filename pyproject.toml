[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowbias-lab"
version = "0.1.0"
description = "Spurious correlation detection and mitigation in synthetic image classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Reserved dependencies for later stages; Stage 1 is CPU-only NumPy/Pillow.
ml = ["torch>=2.2", "torchvision>=0.17", "pandas>=2.1", "matplotlib>=3.8"]
app = ["streamlit>=1.35"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
cowbias-prepare-data = "cowbias.data.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
