name: Full Stage 3 evaluation

on:
  push:
    branches: [feat/stage-3-evaluation-explainability]
    paths:
      - '.github/workflows/full-evaluation.yml'
      - 'src/cowbias/evaluation/**'
      - 'scripts/evaluate_experiment.py'
      - 'scripts/verify_evaluation.py'
      - 'scripts/restore_stage2.py'
      - 'scripts/verify_dataset_identity.py'
      - 'scripts/summarize_evaluation.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage3-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Six frozen CNNs on held-out pairs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EVALUATION_RUN: artifacts/runs/stage3-full-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore CPU scientific environment
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.4 Pillow==12.3.0 PyYAML==6.0.3 matplotlib==3.10.8
          python -m pip install -e '.[eval,dev]'
      - name: Protocol and regression tests before full test inference
        run: |
          python -m pytest -q
          python -m ruff check .
      - name: Retrieve original archive and verify workflow identity and ZIP digest
        run: python scripts/restore_stage2.py --archive artifacts/runs/stage2.zip --output artifacts/runs/downloaded-stage2
      - name: Verify all six frozen checkpoints without mutating bundle
        run: |
          python -c "from pathlib import Path; from cowbias.evaluation.evaluator import verify_frozen_run; print(verify_frozen_run(Path('artifacts/runs/downloaded-stage2'), True))"
      - name: Regenerate original datasets and audit source isolation and pairs
        run: |
          python scripts/prepare_data.py --config artifacts/runs/downloaded-stage2/dataset_generation.yaml --output artifacts/runs/stage3-regenerated-data --seeds 42 123 2026
          python scripts/verify_dataset_identity.py --training-run artifacts/runs/downloaded-stage2 --data-run artifacts/runs/stage3-regenerated-data --seeds 42 123 2026
      - name: Execute full held-out inference, counterfactuals, Grad-CAM and figures
        run: |
          set -o pipefail
          python scripts/evaluate_experiment.py --training-run artifacts/runs/downloaded-stage2 --bundle-archive artifacts/runs/stage2.zip --data-run artifacts/runs/stage3-regenerated-data --seeds 42 123 2026 --device cpu --output "$EVALUATION_RUN" 2>&1 | tee artifacts/runs/stage3-execution.log
      - name: Independently verify exported scientific evidence
        run: |
          python scripts/verify_evaluation.py --run "$EVALUATION_RUN" --require-full
          python scripts/summarize_evaluation.py --run "$EVALUATION_RUN" --github-summary
      - name: Persist scientific outputs and diagnostic execution log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-scientific-results
          path: |
            ${{ env.EVALUATION_RUN }}/**
            artifacts/runs/stage3-execution.log
            artifacts/runs/stage2.retrieval.json
          if-no-files-found: error
          retention-days: 90
