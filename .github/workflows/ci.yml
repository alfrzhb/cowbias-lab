name: Dataset and training CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/stage-4-streamlit-dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTEST_ADDOPTS: --basetemp=artifacts/ci-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml,eval,ui,dev]'
      - name: Test (real generation, audit and paired training)
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: CPU training lifecycle smoke
        run: |
          python scripts/run_experiment.py --config config/experiment.yaml --smoke --device cpu --output artifacts/runs/ci-smoke
          python scripts/verify_checkpoints.py --run artifacts/runs/ci-smoke
      - name: CPU evaluation lifecycle smoke
        run: |
          python scripts/evaluate_experiment.py --training-run artifacts/runs/ci-smoke --data-run artifacts/runs/ci-smoke/datasets --seeds 42 --device cpu --smoke --output artifacts/runs/ci-evaluation-smoke
          python scripts/verify_evaluation.py --run artifacts/runs/ci-evaluation-smoke
      - name: Upload evaluation smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-smoke-python-${{ matrix.python-version }}
          path: artifacts/runs/ci-evaluation-smoke/**
          if-no-files-found: error
          retention-days: 7
      - name: Genuine dashboard fixture and UI acceptance
        run: |
          python scripts/prepare_dashboard.py --fixture-run artifacts/runs/ci-evaluation-smoke
          python scripts/verify_dashboard.py --run artifacts/runs/ci-evaluation-smoke --fixture --output artifacts/dashboard-fixture-review/consistency.json
          COWBIAS_EVAL_ROOT=artifacts/runs/ci-evaluation-smoke COWBIAS_FIXTURE=1 python -c "from streamlit.testing.v1 import AppTest; a=AppTest.from_file('app/streamlit_app.py', default_timeout=30).run(); assert not a.exception and len(a.tabs)==5"
      - name: Streamlit HTTP startup smoke
        run: |
          COWBIAS_EVAL_ROOT=artifacts/runs/ci-evaluation-smoke COWBIAS_FIXTURE=1 python -m streamlit run app/streamlit_app.py --server.port 8501 > artifacts/dashboard-fixture-review/startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Upload dashboard fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-fixture-python-${{ matrix.python-version }}
          path: artifacts/dashboard-fixture-review/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload smoke checkpoints and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: training-smoke-python-${{ matrix.python-version }}
          path: |
            artifacts/runs/ci-smoke/*.*
            artifacts/runs/ci-smoke/seed_*/*.*
            artifacts/runs/ci-smoke/dataset_manifests/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload representative synthetic dataset review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-review-python-${{ matrix.python-version }}
          path: |
            artifacts/ci-tests/integration*/data/contact_sheet.png
            artifacts/ci-tests/integration*/data/audit.json
            artifacts/ci-tests/integration*/data/group_distribution.csv
            artifacts/ci-tests/integration*/data/dataset_config.json
          if-no-files-found: error
          retention-days: 7
