name: Stage 1 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTEST_ADDOPTS: --basetemp=artifacts/ci-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test (includes real generation and audit)
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Upload representative synthetic dataset review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-review-python-${{ matrix.python-version }}
          path: |
            artifacts/ci-tests/integration*/data/contact_sheet.png
            artifacts/ci-tests/integration*/data/audit.json
            artifacts/ci-tests/integration*/data/group_distribution.csv
            artifacts/ci-tests/integration*/data/dataset_config.json
          if-no-files-found: error
          retention-days: 7
