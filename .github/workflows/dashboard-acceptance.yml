name: Stage 4 full dashboard acceptance

on:
  push:
    branches: [feat/stage-4-streamlit-dashboard]
    paths:
      - 'app/**'
      - 'src/cowbias/dashboard/**'
      - 'scripts/*dashboard*'
      - 'tests/test_dashboard*'
      - 'pyproject.toml'
      - '.streamlit/**'
      - '.github/workflows/dashboard-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage4-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      COWBIAS_TEST_FULL_RUN: artifacts/runs/downloaded-stage3/stage3-full-38874819983-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU verification, UI and browser dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.4 Pillow==12.3.0 PyYAML==6.0.3 matplotlib==3.10.8
          python -m pip install -e '.[ui,eval,dev,browser]'
          python -m playwright install --with-deps chromium --only-shell
      - name: Restore exact Stage 3 ZIP and run scientific verification
        run: python scripts/prepare_dashboard.py
      - name: UI source consistency and full-artifact tests
        run: |
          python scripts/verify_dashboard.py --run "$COWBIAS_TEST_FULL_RUN" --output artifacts/dashboard-review/consistency.json
          python -m pytest tests/test_dashboard_real.py -q
      - name: Real Streamlit browser, downloads and three viewports
        run: python scripts/review_dashboard.py --run "$COWBIAS_TEST_FULL_RUN"
      - name: Upload private dashboard review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage4-dashboard-review
          path: |
            artifacts/dashboard-review/**
            artifacts/runs/downloaded-stage3/*.dashboard-receipt.json
          if-no-files-found: error
          retention-days: 90
